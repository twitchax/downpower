[package]
name = "xtask"
description = "Repo chores, run through `cargo xtask`: regenerating the catalog snapshots from the raw store."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
downpower-ingest.workspace = true
# `finding`: the views and their state (the app), and the parser a stub must pass (core's `render`,
# which also puts core's render tests in the workspace's test run).
downpower-app.workspace = true
downpower-core = { workspace = true, features = ["render"] }
chrono.workspace = true
zip.workspace = true
calamine.workspace = true
dbase.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
