[package]
name = "downpower-app"
description = "The downpower components, pages and document shell."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
downpower-core.workspace = true
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
icondata_lu.workspace = true
icondata_core.workspace = true
chrono.workspace = true
serde.workspace = true
# The browser half only: fetching the buffers and drawing the canvas.
serde_json = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CanvasRenderingContext2d",
    "ContextAttributes2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }

# The server builds this crate with `ssr`, the browser bundle with `hydrate`.
[features]
default = []
hydrate = ["leptos/hydrate", "dep:serde_json", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]
ssr = ["leptos/ssr", "leptos_meta/ssr", "leptos_router/ssr"]

[dev-dependencies]
anyhow.workspace = true
pretty_assertions.workspace = true

[lints]
workspace = true
