[package]
name = "downpower-core"
description = "What the server and the browser share: the cause families and the barcode buffer's format."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# Built for the browser too, so nothing here may need a server or an OS.
[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
# `render` only: the app's build script parses findings/*.md and renders their notes.
pulldown-cmark = { workspace = true, optional = true }
toml = { workspace = true, optional = true }

[features]
render = ["dep:pulldown-cmark", "dep:toml"]

[dev-dependencies]
pretty_assertions.workspace = true
serde_json.workspace = true

[lints]
workspace = true
